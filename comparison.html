<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English → Python Playground</title>
<!-- Fixed v0.6 renderer. Replace only the JSON payload for each experiment.
For chat hosts, adapt the slider to a native local control if necessary and
place the host-native retry field/button directly below the rendered result.
The default payload is a simulated sample. No network or model calls. -->
<style>
  :root{color-scheme:light dark}
  body{margin:0;font:16px system-ui,sans-serif}
  .playground{padding:4px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
  #level{display:block;width:100%;margin:0 0 16px;accent-color:light-dark(#555,#bbb)}
  .viewport{overflow-x:auto;padding-bottom:4px}
  .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px;min-width:680px;font:18px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}
  .cell{background:light-dark(#f7f7f7,#202020);border-inline:1px solid light-dark(#ddd,#444);padding:0 12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.65em;align-self:stretch}
  .head{border-top:1px solid light-dark(#ddd,#444);border-radius:10px 10px 0 0;padding:12px;font:600 15px system-ui}
  .end{border-bottom:1px solid light-dark(#ddd,#444);border-radius:0 0 10px 10px;padding-bottom:14px}
  .control{color:light-dark(#813db1,#cc9afa)}
  .state{color:light-dark(#1763b1,#84baff)}
  .value{color:light-dark(#237b48,#87d5a1)}
  .action{color:light-dark(#a55c10,#f0b36b)}
  .result{display:flex;justify-content:space-between;gap:12px;align-items:start;margin:10px 0 0;font-size:14px}
  #stdout{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;font-family:ui-monospace,monospace}
  #status,#assumptions{font-size:12px;color:light-dark(#626262,#aaa)}
  #status{flex-shrink:0}
  #assumptions{margin:6px 0 0}
</style>
<section class="playground">
  <div class="toolbar"><label for="level"><strong>Abstraction</strong></label><output id="levelName" for="level">Natural</output></div>
  <input id="level" type="range" min="0" max="4" step="1" value="0">
  <div class="viewport"><div class="pair" id="comparison"></div></div>
  <div class="result"><span id="stdout"></span><span id="status"></span></div>
  <p id="assumptions" hidden></p>
</section>
<script type="application/json" id="experiment-data">
{"idea":"If a car is above the speed limit, issue a ticket.","python":[[["speed","state"],[" = ","plain"],["75","value"]],[["speed_limit","state"],[" = ","plain"],["60","value"]],[],[["if","control"],[" ","plain"],["speed","state"],[" > ","plain"],["speed_limit","state"],[":","plain"]],[["    ","plain"],["print","action"],["(","plain"],["\"Issue a ticket\"","value"],[")","plain"]]],"english":[[[["The car's speed","state"],[" is ","plain"],["75","value"],[" mph.","plain"]],[["The speed limit","state"],[" is ","plain"],["60","value"],[" mph.","plain"]],[],[["If","control"],[" the ","plain"],["car's speed","state"],[" exceeds the ","plain"],["limit","state"],[":","plain"]],[["    ","plain"],["Show","action"],[" the instruction ","plain"],["Issue a ticket","value"],[".","plain"]]],[[["Set ","plain"],["car speed","state"],[" to ","plain"],["75","value"],[" mph.","plain"]],[["Set the ","plain"],["speed limit","state"],[" to ","plain"],["60","value"],[" mph.","plain"]],[],[["If","control"],[" ","plain"],["car speed","state"],[" is greater than the ","plain"],["speed limit","state"],[":","plain"]],[["    ","plain"],["Display","action"],[" ","plain"],["\"Issue a ticket\"","value"],[".","plain"]]],[[["Set ","plain"],["speed","state"],[" to ","plain"],["75","value"],[".","plain"]],[["Set ","plain"],["speed limit","state"],[" to ","plain"],["60","value"],[".","plain"]],[],[["If","control"],[" ","plain"],["speed","state"],[" > ","plain"],["speed limit","state"],[":","plain"]],[["    ","plain"],["Output","action"],[" ","plain"],["\"Issue a ticket\"","value"],[".","plain"]]],[[["Assign ","plain"],["75","value"],[" to ","plain"],["speed","state"],[".","plain"]],[["Assign ","plain"],["60","value"],[" to ","plain"],["speed_limit","state"],[".","plain"]],[],[["If","control"],[" ","plain"],["speed","state"],[" is greater than ","plain"],["speed_limit","state"],[":","plain"]],[["    ","plain"],["Print","action"],[" the string ","plain"],["\"Issue a ticket\"","value"],[".","plain"]]],[[["Bind ","plain"],["speed","state"],[" to integer ","plain"],["75","value"],[".","plain"]],[["Bind ","plain"],["speed_limit","state"],[" to integer ","plain"],["60","value"],[".","plain"]],[],[["If","control"],[" ","plain"],["speed","state"],[" > ","plain"],["speed_limit","state"],[" evaluates to True:","plain"]],[["    ","plain"],["Call ","plain"],["print","action"],[" with ","plain"],["\"Issue a ticket\"","value"],[".","plain"]]]],"result":{"status":"simulated","output":"Issue a ticket"},"assumptions":"Example speed 75 mph, limit 60 mph. Issuing a ticket is represented by displaying an instruction."}
</script>
<script>
(() => {
  const data=JSON.parse(document.getElementById("experiment-data").textContent);
  const names=["Natural","Precise","Logical","Technical","Literal"];
  const roles=new Set(["control","state","value","action","plain"]);
  const statuses={executed:"Executed",simulated:"Simulated — not executed",error:"Execution error"};
  const join=line=>line.map(s=>s[0]).join("");
  const indent=line=>join(line).match(/^ */)[0];
  function validate(d){
    if(typeof d.idea!=="string"||typeof d.assumptions!=="string"||!Array.isArray(d.python)||!d.python.length||!Array.isArray(d.english)||d.english.length!==5||!d.result||!Object.hasOwn(statuses,d.result.status)||typeof d.result.output!=="string") throw Error("Invalid experiment");
    const lines=[...d.python,...d.english.flat()];
    for(const line of lines){
      if(!Array.isArray(line))throw Error("Invalid line");
      for(const span of line){
        if(!Array.isArray(span)||span.length!==2||typeof span[0]!=="string"||/[\r\n]/.test(span[0])||!roles.has(span[1]))throw Error("Invalid span");
      }
    }
    for(const level of d.english){
      if(level.length!==d.python.length)throw Error("Row count mismatch");
      level.forEach((line,i)=>{
        const source=d.python[i];
        if(indent(line)!==indent(source))throw Error("Indent mismatch at row "+(i+1));
        if(!join(source).trim()&&join(line).trim())throw Error("Blank row mismatch at "+(i+1));
      });
    }
  }
  function cell(line,extra=""){
    const div=document.createElement("div");
    div.className="cell "+extra;
    for(const [text,role] of line){
      const span=document.createElement("span");
      if(role!=="plain")span.className=role;
      span.textContent=text;
      div.append(span);
    }
    return div;
  }
  function render(level){
    document.getElementById("levelName").textContent=names[level];
    const target=document.getElementById("comparison");
    target.replaceChildren(cell([["Python","plain"]],"head"),cell([["English","plain"]],"head"));
    data.python.forEach((line,i)=>{
      const extra=i===data.python.length-1?"end":"";
      target.append(cell(line,extra),cell(data.english[level][i],extra));
    });
  }
  validate(data);
  document.getElementById("stdout").textContent=data.result.output||"(no output)";
  document.getElementById("status").textContent=statuses[data.result.status];
  const assumptions=document.getElementById("assumptions");
  assumptions.textContent=data.assumptions;
  assumptions.hidden=!data.assumptions;
  document.getElementById("level").addEventListener("input",e=>render(Number(e.target.value)));
  render(0);
})();
</script>
</html>
